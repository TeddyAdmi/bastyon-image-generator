<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bastyon Image Generator</title>
    
    <!-- Подключение официального SDK Bastyon -->
    <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app { width: 100%; max-width: 480px; padding: 20px; }
        .title { text-align: center; font-size: 24px; font-weight: bold; margin-bottom: 6px; }
        .subtitle { text-align: center; color: #9ca3af; margin-bottom: 20px; font-size: 13px; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        textarea {
            width: 100%;
            height: 90px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-size: 14px;
            resize: none;
        }
        textarea:focus { outline: none; border-color: #f97316; }
        .btn {
            border: 0;
            border-radius: 12px;
            padding: 14px;
            background: #f97316;
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
        }
        .btn:hover { background: #ea580c; }
        .btn:disabled { background: #4b5563; cursor: not-allowed; }
        .result { margin-top: 20px; text-align: center; display: none; }
        .result img { max-width: 100%; border-radius: 12px; margin-top: 10px; border: 1px solid #374151; }
        .status { margin-top: 15px; text-align: center; color: #6ee7b7; font-size: 13px; min-height: 20px; }
    </style>
</head>
<body>

<div class="app">
    <div class="title">AI Generator</div>
    <div class="subtitle">Бесплатная генерация изображений</div>

    <div class="input-group">
        <textarea id="promptInput" placeholder="Введите промпт для генерации изображения...">A cute cat in a cyberpunk city</textarea>
        <button id="generateBtn" class="btn" onclick="startGeneration()">Сгенерировать</button>
    </div>

    <div id="resultContainer" class="result">
        <p style="font-size: 14px; color: #9ca3af; margin: 0;">Результат:</p>
        <img id="resultImage" src="" alt="Generated Image">
    </div>

    <div id="status" class="status">Инициализация SDK...</div>
</div>

<script>
let sdk = null;

// Инициализация Bastyon SDK
async function initBastyon() {
    try {
        if (typeof BastyonSdk !== 'undefined') {
            sdk = new BastyonSdk();
            await sdk.init();
            sdk.emit("loaded");
            document.getElementById("status").textContent = "Bastyon подключён";
        }
    } catch (e) {
        document.getElementById("status").textContent = "Автономный режим";
    }
}

// Запуск процесса генерации
async function startGeneration() {
    const promptText = document.getElementById("promptInput").value.trim();
    if (!promptText) {
        alert("Введите текст промпта!");
        return;
    }

    const btn = document.getElementById("generateBtn");
    const statusEl = document.getElementById("status");
    const resultContainer = document.getElementById("resultContainer");
    const resultImage = document.getElementById("resultImage");

    btn.disabled = true;
    resultContainer.style.display = "none";
    statusEl.textContent = "⏳ Генерация изображения (подождите)...";

    try {
        const response = await fetch('https://bastyon-image-generator.vercel.app/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: promptText })
        });

        const data = await response.json();
        console.log("Ответ от API:", data);

        if (!response.ok || data.error) {
            if (response.status === 429) {
                throw new Error("Слишком много запросов (ошибка 429). Сервер временно перегружен, подождите 1-2 минуты.");
            }
            throw new Error(data.error || `HTTP error! status: ${response.status}`);
        }

        const candidate = data?.candidates?.[0];
        const inlineData = candidate?.content?.parts?.[0]?.inline_data;

        if (!inlineData || !inlineData.data) {
            throw new Error("Не удалось найти данные изображения в ответе сервера.");
        }

        const mimeType = inlineData.mime_type || 'image/jpeg';
        const base64String = inlineData.data;

        resultImage.src = `data:${mimeType};base64,${base64String}`;
        resultContainer.style.display = "block";
        statusEl.textContent = "✅ Готово!";

    } catch (err) {
        console.error("Критическая ошибка генерации:", err);
        statusEl.textContent = "❌ " + err.message;
    } finally {
        // Защита от спама кнопкой: задержка 5 секунд перед повторным нажатием
        setTimeout(() => {
            btn.disabled = false;
        }, 5000);
    }
}

window.onload = initBastyon;
</script>

</body>
</html>
