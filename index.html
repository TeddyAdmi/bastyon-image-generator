<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090b">
  <title>Bastyon AI Image Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #09090b;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .subtitle {
      color: #999;
      font-size: 14px;
    }

    .card {
      background: #111114;
      border: 1px solid #27272a;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #bbb;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      background: #09090b;
      border: 1px solid #303035;
      border-radius: 12px;
      color: #fff;
      padding: 15px;
      font-size: 16px;
      line-height: 1.5;
      outline: none;
    }

    textarea:focus {
      border-color: #666;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 16px;
    }

    select {
      width: 100%;
      background: #09090b;
      border: 1px solid #303035;
      color: #fff;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 15px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #generateBtn {
      width: 100%;
      margin-top: 18px;
      background: #fff;
      color: #000;
    }

    #generateBtn:disabled {
      opacity: .5;
      cursor: wait;
    }

    .status {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #18181b;
      color: #bbb;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 14px;
      border-radius: 10px;
      background: #351515;
      border: 1px solid #6b2525;
      color: #ffb4b4;
      white-space: pre-wrap;
    }

    .result {
      display: none;
    }

    .result img {
      display: block;
      width: 100%;
      max-height: 800px;
      object-fit: contain;
      border-radius: 14px;
      background: #050505;
    }

    .result-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .result-actions a,
    .result-actions button {
      flex: 1;
      text-align: center;
      text-decoration: none;
      background: #202024;
      color: #fff;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #303035;
    }

    .debug {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      background: #050505;
      border: 1px solid #222;
      color: #888;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
      overflow-x: auto;
    }

    @media (max-width: 650px) {
      .app {
        padding: 14px;
      }

      h1 {
        font-size: 25px;
      }

      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>AI Image Generator</h1>
    <div class="subtitle">
      Bastyon · PixelSter · Flux Dev
    </div>
  </header>

  <div class="card">

    <label for="prompt">Описание изображения</label>

    <textarea
      id="prompt"
      placeholder="Например: маленький рыжий кот сидит на улице Нью-Йорка, кинематографический свет, фотореализм"
    ></textarea>

    <div class="controls">

      <div>
        <label for="ratio">Формат</label>

        <select id="ratio">
          <option value="1:1">1:1 — квадрат</option>
          <option value="16:9">16:9 — горизонтальный</option>
          <option value="9:16">9:16 — вертикальный</option>
          <option value="4:3">4:3</option>
          <option value="3:4">3:4</option>
          <option value="2:1">2:1</option>
          <option value="1:2">1:2</option>
          <option value="3:2">3:2</option>
          <option value="2:3">2:3</option>
          <option value="4:5">4:5</option>
          <option value="5:4">5:4</option>
        </select>
      </div>

      <div>
        <label>Модель</label>

        <select disabled>
          <option>Flux Dev</option>
        </select>
      </div>

    </div>

    <button id="generateBtn">
      ✨ Создать изображение
    </button>

    <div id="status" class="status"></div>

    <div id="error" class="error"></div>

  </div>

  <div id="result" class="card result">

    <h2>Результат</h2>

    <img id="resultImage" src="" alt="Generated image">

    <div class="result-actions">

      <a
        id="openImage"
        href="#"
        target="_blank"
        rel="noopener"
      >
        Открыть
      </a>

      <a
        id="downloadImage"
        href="#"
        download="generated-image.jpg"
      >
        Скачать
      </a>

    </div>

  </div>

  <div id="debug" class="debug">
Готов к тесту.
  </div>

</div>

<script>
  const promptInput = document.getElementById("prompt");
  const ratioInput = document.getElementById("ratio");
  const generateBtn = document.getElementById("generateBtn");

  const statusBox = document.getElementById("status");
  const errorBox = document.getElementById("error");

  const resultBox = document.getElementById("result");
  const resultImage = document.getElementById("resultImage");

  const openImage = document.getElementById("openImage");
  const downloadImage = document.getElementById("downloadImage");

  const debugBox = document.getElementById("debug");

  function showStatus(text) {
    statusBox.style.display = "block";
    statusBox.textContent = text;
  }

  function hideStatus() {
    statusBox.style.display = "none";
  }

  function showError(text) {
    errorBox.style.display = "block";
    errorBox.textContent = text;
  }

  function hideError() {
    errorBox.style.display = "none";
    errorBox.textContent = "";
  }

  function debug(text) {
    debugBox.textContent = text;
    console.log(text);
  }

  generateBtn.addEventListener("click", async () => {

    const prompt = promptInput.value.trim();
    const ratio = ratioInput.value;

    hideError();

    resultBox.style.display = "none";

    if (!prompt) {
      showError("Введите описание изображения.");
      return;
    }

    generateBtn.disabled = true;

    showStatus("⏳ Генерация изображения...");

    debug(
      "Отправляем запрос:\n\n" +
      JSON.stringify(
        {
          prompt,
          ratio
        },
        null,
        2
      )
    );

    try {

      const response = await fetch("/api/generate", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          prompt,
          ratio
        })
      });

      const rawText = await response.text();

      debug(
        "HTTP статус: " +
        response.status +
        "\n\nОтвет сервера:\n\n" +
        rawText
      );

      let data;

      try {
        data = JSON.parse(rawText);
      } catch (e) {

        throw new Error(
          "Сервер вернул не JSON.\n\n" +
          rawText.substring(0, 1000)
        );

      }

      if (!response.ok) {

        throw new Error(
          data.error ||
          "Ошибка API. HTTP " + response.status
        );

      }

      if (!data.success) {

        throw new Error(
          data.error ||
          "Генерация не удалась."
        );

      }

      if (!data.imageUrl) {

        throw new Error(
          "API ответил успешно, но imageUrl отсутствует."
        );

      }

      resultImage.src = data.imageUrl;

      openImage.href = data.imageUrl;

      downloadImage.href = data.imageUrl;

      resultBox.style.display = "block";

      showStatus(
        "✅ Изображение готово!\n" +
        "Модель: " +
        (data.model || "Flux Dev") +
        "\nФормат: " +
        (data.ratio || ratio)
      );

      debug(
        "УСПЕХ\n\n" +
        "Модель: " +
        (data.model || "Flux Dev") +
        "\n\n" +
        "Image URL:\n" +
        data.imageUrl
      );

    } catch (error) {

      console.error(error);

      showError(
        "❌ Ошибка генерации\n\n" +
        error.message
      );

      showStatus(
        "Генерация завершилась ошибкой."
      );

      debug(
        "ОШИБКА:\n\n" +
        error.message
      );

    } finally {

      generateBtn.disabled = false;

    }

  });

</script>

</body>
</html>
