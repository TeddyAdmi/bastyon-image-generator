<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="theme-color" content="#09090b">

    <title>AI Image Generator</title>

    <style>
        :root {
            --bg: #09090b;
            --panel: #121216;
            --panel-2: #18181d;
            --panel-3: #202026;
            --border: #292930;

            --text: #f5f5f7;
            --muted: #9696a2;

            --accent: #ff7a18;
            --accent-hover: #ff8d36;

            --success: #48d597;
            --danger: #ff5f5f;
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: var(--bg);
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #17171d 0,
                    #09090b 42%,
                    #09090b 100%
                );

            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        button,
        textarea,
        select {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            width: 100%;
            max-width: 1180px;

            margin: 0 auto;

            min-height: 100vh;

            padding:
                max(12px, env(safe-area-inset-top))
                14px
                max(24px, env(safe-area-inset-bottom))
                14px;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;

            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .brand-icon {
            width: 30px;
            height: 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 9px;

            background: linear-gradient(
                135deg,
                #ff7a18,
                #ff9e55
            );

            color: #111;

            font-size: 17px;
            font-weight: 900;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 6px;

            padding: 7px 10px;

            border: 1px solid var(--border);
            border-radius: 999px;

            background: rgba(20, 20, 24, 0.9);

            color: var(--muted);

            font-size: 11px;
        }

        .status-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--success);
        }

        /* =========================
           MAIN
        ========================= */

        .workspace {
            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                350px;

            gap: 14px;
        }

        .card {
            background: rgba(18, 18, 22, 0.96);

            border: 1px solid var(--border);

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.22);
        }

        /* =========================
           PREVIEW
        ========================= */

        .generator {
            display: flex;
            flex-direction: column;

            min-height: 700px;
        }

        .preview {
            position: relative;

            flex: 1;

            min-height: 470px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 18px;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    #23232b 0,
                    #141419 38%,
                    #0d0d10 75%,
                    #0a0a0c 100%
                );
        }

        .preview.empty::before {
            content: "Ваше изображение появится здесь";

            color: #656570;

            font-size: 14px;
        }

        .preview img {
            display: block;

            max-width: 100%;
            max-height: 650px;

            width: auto;
            height: auto;

            object-fit: contain;

            border-radius: 14px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.55);
        }

        .preview-info {
            position: absolute;

            left: 14px;
            bottom: 14px;

            display: none;

            padding: 6px 9px;

            background: rgba(0, 0, 0, 0.65);

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 8px;

            color: #c8c8cf;

            font-size: 10px;

            backdrop-filter: blur(8px);
        }

        /* =========================
           PROMPT
        ========================= */

        .prompt-area {
            padding: 14px;

            border-top: 1px solid var(--border);
        }

        .prompt-wrapper {
            position: relative;
        }

        textarea {
            display: block;

            width: 100%;

            min-height: 100px;

            resize: vertical;

            padding: 14px 14px 42px;

            border:
                1px solid
                var(--border);

            border-radius: 14px;

            outline: none;

            background: var(--panel-2);

            color: var(--text);

            font-size: 14px;

            line-height: 1.5;
        }

        textarea::placeholder {
            color: #6f6f79;
        }

        textarea:focus {
            border-color: #474750;
        }

        .prompt-hint {
            position: absolute;

            right: 10px;
            bottom: 9px;

            color: #666670;

            font-size: 10px;
        }

        .actions {
            display: flex;

            gap: 8px;

            margin-top: 9px;
        }

        .generate {
            flex: 1;

            min-height: 46px;

            border: 0;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    #ff984d
                );

            color: #111;

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;

            transition:
                transform .15s,
                filter .15s;
        }

        .generate:hover {
            filter: brightness(1.05);
        }

        .generate:active {
            transform: scale(.985);
        }

        .generate:disabled {
            opacity: .55;
            cursor: wait;
        }

        .clear {
            min-width: 90px;

            border: 1px solid var(--border);

            border-radius: 12px;

            background: var(--panel-2);

            color: var(--text);

            cursor: pointer;
        }

        .loading {
            display: none;

            margin-top: 8px;

            color: var(--accent-hover);

            font-size: 12px;
        }

        .loading.show {
            display: block;
        }

        /* =========================
           SETTINGS
        ========================= */

        .settings {
            padding: 16px;
        }

        .section {
            margin-bottom: 19px;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            margin-bottom: 8px;

            color: var(--muted);

            font-size: 11px;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: .5px;
        }

        /* =========================
           MODELS
        ========================= */

        .models {
            display: grid;

            gap: 8px;
        }

        .model {
            width: 100%;

            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 11px 12px;

            border: 1px solid var(--border);

            border-radius: 13px;

            background: var(--panel-2);

            color: var(--text);

            text-align: left;

            cursor: pointer;

            transition:
                border-color .15s,
                background .15s;
        }

        .model:hover {
            background: var(--panel-3);
        }

        .model.active {
            border-color: var(--accent);

            box-shadow:
                inset 0 0 0 1px rgba(255,122,24,.16);
        }

        .model-name {
            font-size: 13px;
            font-weight: 750;
        }

        .model-description {
            margin-top: 3px;

            color: var(--muted);

            font-size: 10px;
        }

        .free-badge {
            padding: 3px 6px;

            border-radius: 6px;

            background: #25252b;

            color: #c7c7cf;

            font-size: 9px;
            font-weight: 700;
        }

        /* =========================
           SELECTS
        ========================= */

        .settings-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 8px;
        }

        .field label {
            display: block;

            margin-bottom: 6px;

            color: #777782;

            font-size: 10px;
        }

        select {
            width: 100%;

            min-height: 43px;

            padding: 9px 10px;

            border:
                1px solid
                var(--border);

            border-radius: 11px;

            outline: none;

            background: var(--panel-2);

            color: var(--text);

            font-size: 12px;
        }

        select:focus {
            border-color: #4b4b54;
        }

        /* =========================
           INFO
        ========================= */

        .info {
            padding: 11px 12px;

            border:
                1px solid
                var(--border);

            border-radius: 12px;

            background: #101014;

            color: #777782;

            font-size: 10px;

            line-height: 1.5;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 760px) {

            .app {
                padding-left: 9px;
                padding-right: 9px;
            }

            .workspace {
                display: flex;

                flex-direction: column;
            }

            .generator {
                min-height: 0;
            }

            .preview {
                height: 52vh;

                min-height: 290px;
                max-height: 560px;
            }

            .settings {
                padding: 13px;
            }

            .header {
                height: 46px;
            }

            .brand {
                font-size: 16px;
            }

            .status {
                font-size: 10px;
            }
        }

        @media (max-width: 420px) {

            .preview {
                height: 48vh;
            }

            textarea {
                min-height: 92px;
            }

            .clear {
                min-width: 76px;
            }

            .generate {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">

            <div class="brand-icon">
                ✦
            </div>

            <span>
                AI Image Generator
            </span>

        </div>

        <div class="status">

            <span
                id="statusDot"
                class="status-dot"
            ></span>

            <span id="status">
                Ready
            </span>

        </div>

    </header>


    <main class="workspace">

        <!-- =========================
             GENERATOR
        ========================== -->

        <section class="card generator">

            <div
                id="preview"
                class="preview empty"
            >
                <div
                    id="previewInfo"
                    class="preview-info"
                ></div>
            </div>


            <div class="prompt-area">

                <div class="prompt-wrapper">

                    <textarea
                        id="prompt"
                        placeholder="Опишите изображение...

Например: очень пушистый рыжий кот сидит на крыше Нью-Йорка на закате, кинематографичный свет, реалистичная фотография"
                    ></textarea>

                    <div class="prompt-hint">
                        Ctrl + Enter
                    </div>

                </div>


                <div class="actions">

                    <button
                        id="clear"
                        class="clear"
                        type="button"
                    >
                        Очистить
                    </button>

                    <button
                        id="generate"
                        class="generate"
                        type="button"
                    >
                        Создать изображение
                    </button>

                </div>


                <div
                    id="loading"
                    class="loading"
                >
                    Генерируем изображение…
                </div>

            </div>

        </section>


        <!-- =========================
             SETTINGS
        ========================== -->

        <aside class="card settings">

            <div class="section">

                <div class="section-title">
                    Модель
                </div>


                <div class="models">


                    <button
                        class="model active"
                        data-model="flux"
                        type="button"
                    >

                        <div>

                            <div class="model-name">
                                FLUX.1 Schnell
                            </div>

                            <div class="model-description">
                                Быстрая универсальная модель
                            </div>

                        </div>

                        <span class="free-badge">
                            FREE
                        </span>

                    </button>


                    <button
                        class="model"
                        data-model="zimage"
                        type="button"
                    >

                        <div>

                            <div class="model-name">
                                Z-Image Turbo
                            </div>

                            <div class="model-description">
                                Быстрое создание и детали
                            </div>

                        </div>

                        <span class="free-badge">
                            FREE
                        </span>

                    </button>


                    <button
                        class="model"
                        data-model="dreamshaper"
                        type="button"
                    >

                        <div>

                            <div class="model-name">
                                DreamShaper
                            </div>

                            <div class="model-description">
                                Арт, персонажи и стили
                            </div>

                        </div>

                        <span class="free-badge">
                            FREE
                        </span>

                    </button>


                </div>

            </div>


            <div class="section">

                <div class="section-title">
                    Формат изображения
                </div>


                <div class="settings-grid">

                    <div class="field">

                        <label>
                            Соотношение
                        </label>

                        <select id="ratio">

                            <option value="1:1">
                                1:1 — квадрат
                            </option>

                            <option value="16:9">
                                16:9 — горизонтальный
                            </option>

                            <option value="9:16">
                                9:16 — вертикальный
                            </option>

                            <option value="4:3">
                                4:3
                            </option>

                            <option value="3:4">
                                3:4
                            </option>

                            <option value="4:5">
                                4:5
                            </option>

                            <option value="5:4">
                                5:4
                            </option>

                        </select>

                    </div>


                    <div class="field">

                        <label>
                            Размер
                        </label>

                        <select id="size">

                            <option value="768">
                                768 px
                            </option>

                            <option
                                value="1024"
                                selected
                            >
                                1024 px
                            </option>

                            <option value="1280">
                                1280 px
                            </option>

                        </select>

                    </div>

                </div>

            </div>


            <div class="section">

                <div class="section-title">
                    Качество
                </div>


                <select id="quality">

                    <option value="low">
                        Быстрое
                    </option>

                    <option
                        value="medium"
                        selected
                    >
                        Стандартное
                    </option>

                    <option value="high">
                        Высокое
                    </option>

                </select>

            </div>


            <div class="section">

                <div class="info">

                    Бесплатные модели могут иметь
                    ограничения или временные лимиты
                    со стороны провайдера.

                    <br><br>

                    Размер, формат и качество
                    выбираются перед каждой генерацией.

                </div>

            </div>

        </aside>

    </main>

</div>


<script>

    /*
    ============================================
    SETTINGS
    ============================================
    */

    const API_URL = "/api/generate";

    let selectedModel = "flux";


    /*
    ============================================
    ELEMENTS
    ============================================
    */

    const promptElement =
        document.getElementById("prompt");

    const generateButton =
        document.getElementById("generate");

    const clearButton =
        document.getElementById("clear");

    const preview =
        document.getElementById("preview");

    const previewInfo =
        document.getElementById("previewInfo");

    const status =
        document.getElementById("status");

    const statusDot =
        document.getElementById("statusDot");

    const loading =
        document.getElementById("loading");

    const ratio =
        document.getElementById("ratio");

    const size =
        document.getElementById("size");

    const quality =
        document.getElementById("quality");


    /*
    ============================================
    MODEL SELECTION
    ============================================
    */

    document
        .querySelectorAll(".model")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(".model")
                        .forEach(item => {

                            item.classList.remove(
                                "active"
                            );

                        });


                    button.classList.add(
                        "active"
                    );


                    selectedModel =
                        button.dataset.model;

                }
            );

        });


    /*
    ============================================
    DIMENSIONS
    ============================================
    */

    function getDimensions(
        selectedRatio,
        baseSize
    ) {

        const s =
            Number(baseSize);


        const dimensions = {

            "1:1": [
                s,
                s
            ],

            "16:9": [
                s,
                Math.round(
                    s * 9 / 16
                )
            ],

            "9:16": [
                Math.round(
                    s * 9 / 16
                ),
                s
            ],

            "4:3": [
                s,
                Math.round(
                    s * 3 / 4
                )
            ],

            "3:4": [
                Math.round(
                    s * 3 / 4
                ),
                s
            ],

            "4:5": [
                Math.round(
                    s * 4 / 5
                ),
                s
            ],

            "5:4": [
                s,
                Math.round(
                    s * 4 / 5
                )
            ]

        };


        return (
            dimensions[selectedRatio]
            ||
            dimensions["1:1"]
        );

    }


    /*
    ============================================
    STATUS
    ============================================
    */

    function setStatus(
        text,
        type = "normal"
    ) {

        status.textContent =
            text;


        if (type === "error") {

            statusDot.style.background =
                "#ff5f5f";

        } else if (type === "loading") {

            statusDot.style.background =
                "#ff9a45";

        } else {

            statusDot.style.background =
                "#48d597";

        }

    }


    /*
    ============================================
    CLEAR
    ============================================
    */

    clearButton.addEventListener(
        "click",
        () => {

            promptElement.value = "";

            preview.className =
                "preview empty";

            preview.innerHTML = `
                <div
                    id="previewInfo"
                    class="preview-info"
                ></div>
            `;

            setStatus("Ready");

            promptElement.focus();

        }
    );


    /*
    ============================================
    GENERATE
    ============================================
    */

    async function generateImage() {

        const prompt =
            promptElement.value.trim();


        if (!prompt) {

            promptElement.focus();

            setStatus(
                "Введите промпт",
                "error"
            );

            return;

        }


        const [
            width,
            height
        ] = getDimensions(
            ratio.value,
            size.value
        );


        generateButton.disabled =
            true;

        loading.classList.add(
            "show"
        );

        setStatus(
            "Генерация…",
            "loading"
        );


        try {

            const response =
                await fetch(
                    API_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            prompt,

                            model:
                                selectedModel,

                            width,

                            height,

                            quality:
                                quality.value

                        })

                    }
                );


            const data =
                await response
                    .json()
                    .catch(() => ({}));


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Ошибка генерации"
                );

            }


            if (
                !data.image ||
                !data.image.data
            ) {

                throw new Error(
                    "Сервер не вернул изображение"
                );

            }


            const mime =
                data.image.mime ||
                "image/png";


            const imageSource =
                "data:" +
                mime +
                ";base64," +
                data.image.data;


            preview.className =
                "preview";


            preview.innerHTML = "";


            const image =
                document.createElement(
                    "img"
                );


            image.alt =
                prompt;


            image.src =
                imageSource;


            preview.appendChild(
                image
            );


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "preview-info";


            info.style.display =
                "block";


            info.textContent =
                `${data.modelName || "AI"} · ${width}×${height}`;


            preview.appendChild(
                info
            );


            setStatus(
                "Готово"
            );


        } catch (error) {

            console.error(
                "Generation error:",
                error
            );


            setStatus(
                "Ошибка",
                "error"
            );


            alert(
                error.message ||
                "Не удалось создать изображение"
            );

        } finally {

            generateButton.disabled =
                false;

            loading.classList.remove(
                "show"
            );

        }

    }


    generateButton.addEventListener(
        "click",
        generateImage
    );


    /*
    ============================================
    CTRL + ENTER
    ============================================
    */

    promptElement.addEventListener(
        "keydown",
        event => {

            if (
                (event.ctrlKey ||
                 event.metaKey) &&
                event.key === "Enter"
            ) {

                event.preventDefault();

                generateImage();

            }

        }
    );

</script>

</body>
</html>
